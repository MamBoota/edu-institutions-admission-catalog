# Локальный PostgreSQL для разработки (make db-up).
# Переменные совпадают с примером DATABASE_URL в README и backend/.env.example.

services:
  db:
    image: postgres:15-alpine
    container_name: edu_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: edu_catalog
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
