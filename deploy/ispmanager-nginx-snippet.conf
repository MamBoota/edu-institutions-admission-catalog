# Вставьте в ISPmanager → Сайты → myproj76.ru → «Дополнительные директивы nginx»
# (название пункта может быть «Nginx», «Конфигурация веб-сервера»).
#
# Важно: блок location /api/ должен быть ВЫШЕ try_files для SPA.
# Uvicorn должен слушать 127.0.0.1:8000 (systemd edu-catalog-api).

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

# Без слэша в конце — редирект на /api/...
location = /api {
    return 301 /api/;
}
